<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Flip Away</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/panels.css">
</head>
<body>

    <header class="site-header">
        <h1>One Flip Away</h1>
    </header>

    <section class="comic-grid">

        <div class="panel">
            <img src="assets/panel-01-bedroom.jpg" alt="A student studying alone in his bedroom, an NYUAD brochure on the desk">
            <p class="panel-caption">Panel 1</p>
        </div>

        <div class="panel">
            <img src="assets/panel-02-mynyuad.jpg" alt="The brochure opens to the myNYUAD page, pulling the student in">
            <p class="panel-caption">Panel 2</p>
        </div>

        <div class="panel">
            <img src="assets/panel-03-d2.jpg" alt="The student transported into the D2 dining hall">
            <p class="panel-caption">Panel 3</p>
        </div>

        <div class="panel">
            <img src="assets/panel-04-classroom.jpg" alt="The student transported into a classroom">
            <p class="panel-caption">Panel 4</p>
        </div>

        <div class="panel">
            <img src="assets/panel-05-library.jpg" alt="The student transported into the library">
            <p class="panel-caption">Panel 5</p>
        </div>

        <div class="panel">
            <img src="assets/panel-06-return.jpg" alt="The student closes the brochure and is back in his room">
            <p class="panel-caption">Panel 6</p>
        </div>

    </section>


</body>
</html>
</body>
</html>
