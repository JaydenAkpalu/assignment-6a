<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Flip Away</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="panels.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body id="top">

    <header class="site-header">
        <h1>One Flip Away</h1>
        <p>A journey through NYU Abu Dhabi, one page at a time.</p>
    </header>

    <section class="comic-grid">

        <div class="panel">
            <img src="assets/panel-01-study.webp" alt="A cartoon student in a teal hoodie writes in a notebook beside an open textbook in a room with windows and suitcases." width="1448" height="1086" loading="lazy" decoding="async">
            <p class="panel-caption">Panel 1</p>
        </div>

        <div class="panel">
            <img src="assets/panel-02-brochure.webp" alt="The student reads a purple NYU Abu Dhabi undergraduate admissions brochure at his desk." width="1448" height="1086" loading="lazy" decoding="async">
            <p class="panel-caption">Panel 2</p>
        </div>

        <div class="panel">
            <img src="assets/panel-03-entrance.webp" alt="The student stands beside the myNYUAD sign and palm trees outside a campus building, with an empty thought bubble overhead." width="1169" height="1441" loading="lazy" decoding="async">
            <p class="panel-caption">Panel 3</p>
        </div>

        <div class="panel">
            <img src="assets/panel-04-dining.webp" alt="The student stands in the D2 dining hall in front of food counters and tables." width="764" height="672" loading="lazy" decoding="async">
            <p class="panel-caption">Panel 4</p>
        </div>

        <div class="panel">
            <img src="assets/panel-05-library.webp" alt="The student stands at an upper-floor railing overlooking library bookshelves and study tables, with an empty thought bubble overhead." width="1164" height="1600" loading="lazy" decoding="async">
            <p class="panel-caption">Panel 5</p>
        </div>

        <div class="panel">
            <img src="assets/panel-06-character.webp" alt="A full-length illustration of the smiling student wearing a teal hoodie, gray trousers, and white sneakers." width="1024" height="1536" loading="lazy" decoding="async">
            <p class="panel-caption">Panel 6</p>
        </div>

    </section>

    <footer class="site-footer">
        <p>One Flip Away &middot; A six-panel comic</p>
        <a href="#top">Back to top</a>
    </footer>

</body>
</html>
